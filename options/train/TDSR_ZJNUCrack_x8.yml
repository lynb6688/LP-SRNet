# Task-driven fine-tuning, 8x. The schedule below is TDSR-0.01.
name: TDSR_ZJNUCrack_x8
model_type: TDSRModel
scale: 8
num_gpu: auto
manual_seed: 10

datasets:
  train:
    name: ZJNUCrack
    type: LongitudinalPairedDataset
    dataroot_gt: datasets/ZJNUCrack/train/HR
    dataroot_lq: datasets/ZJNUCrack/train/LR/x8
    dataroot_label: datasets/ZJNUCrack/train/labels
    filename_tmpl: '{}'
    io_backend:
      type: disk
    gt_size_h: 256
    gt_size_w: 256
    use_hflip: true
    use_vflip: true
    max_det: 64
    use_shuffle: true
    num_worker_per_gpu: 4
    batch_size_per_gpu: 4
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: ZJNUCrack_val
    type: LongitudinalPairedDataset
    dataroot_gt: datasets/ZJNUCrack/val/HR
    dataroot_lq: datasets/ZJNUCrack/val/LR/x8
    filename_tmpl: '{}'
    io_backend:
      type: disk

network_g:
  type: LPSRNet
  dim: 36
  n_blocks: 8
  ffn_scale: 2
  upscaling_factor: 8
  in_channels: 1
  out_channels: 1
  gafmb_index: 3
  use_ea: true
  use_pdcfn: true
  use_pps: true
  pool_size: 8

path:
  pretrain_network_g: experiments/LPSRNet_SACrack_x8/models/net_g_latest.pth
  param_key_g: params_ema
  strict_load_g: true
  resume_state: ~
  pretrain_network_det: ~

train:
  ema_decay: 0
  alpha: 1.0
  beta: 0.0
  loss_schedule:
    - {iter: 0, alpha: 1.0, beta: 0.0}
    - {iter: 200000, alpha: 1.0, beta: 0.01}
  detector_opt:
    cls_weight: 7.5
    box_weight: 0.5
    dfl_weight: 1.5
    imgsz: 640
  optim_g:
    type: Adam
    lr: !!float 1e-4
    weight_decay: 0
    betas: [0.9, 0.99]
  scheduler:
    type: MultiStepRestartLR
    milestones: [200000, 400000]
    gamma: 0.1
  total_iter: 600000
  warmup_iter: -1
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean
  fft_opt:
    type: FFTLoss
    loss_weight: 0.05
    reduction: mean

val:
  val_freq: !!float 5000
  save_img: false
  pbar: false
  tile_size: [128, 512]
  tile_overlap: 16
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 8
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 8
      test_y_channel: false

logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5000
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

dist_params:
  backend: nccl
  port: 29500
